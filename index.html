<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="assets/llnkkr.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>링클 - 단축링크</title>
  <meta name="description" content="링클에서 가입 없이 URL을 단축하고 링크를 복사하세요. 광고 없이 목적지로 바로 연결됩니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="링클 - 단축링크">
  <meta property="og:description" content="링클에서 가입 없이 URL을 단축하고 링크를 복사하세요. 광고 없이 목적지로 바로 연결됩니다.">
  </head>
<body data-page="home">
<button id="homeThemeToggle" class="home-theme-toggle" type="button" aria-label="다크 모드" title="다크 모드"><span class="material-symbols-outlined" aria-hidden="true">dark_mode</span></button>
<p class="support-notice"><span class="material-symbols-outlined" aria-hidden="true">shield</span><span data-i18n="supportNotice">이 사이트는 당신의 후원으로 운영됩니다. 감사합니다!</span></p>
<main id="homeScene">
  <h1><img src="assets/llnkkr-wordmark.svg" alt="링클" data-i18n-alt="brand"></h1>
  <form id="shortenForm" autocomplete="off" novalidate>
    <div class="link-input-wrap">
    <input aria-describedby="message" id="targetUrl" name="llnkkr-destination" type="text" inputmode="url" maxlength="2048" placeholder="https://llnk.kr/paste_a_long_URL" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="단축할 URL" data-i18n-aria="urlLabel" required>
    <button id="linkSettingsButton" type="button" aria-label="설정" data-i18n-aria="settings" title="설정" data-i18n-title="settings" aria-haspopup="dialog"><span class="material-symbols-outlined" aria-hidden="true">tune</span></button>
    </div>
    <button id="submitButton" type="submit" aria-label="링크 확인" data-i18n-aria="review" title="링크 확인" data-i18n-title="review" aria-haspopup="dialog">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
    </button>
  </form>
  <div id="result" class="result">
    <a id="shortUrl" target="_blank" rel="noopener noreferrer"></a>
    <button id="copyButton" class="copy" type="button" aria-label="링크 복사" data-i18n-aria="copy" title="링크 복사" data-i18n-title="copy"><span class="material-symbols-outlined" aria-hidden="true">content_copy</span></button>
  </div>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <button id="restartLink" class="flow-secondary" type="button" data-i18n="restart" hidden>다시 시작</button>
</main>
<a class="directory-entry" href="shortener/" data-page-link aria-label="단축링크 서비스 둘러보기" data-i18n-aria="browseShorteners"><span class="material-symbols-outlined" aria-hidden="true">keyboard_arrow_down</span></a>
<a class="extension-link" href="https://chromewebstore.google.com/detail/dccgmckjnbeoidpbckbgmbikhnkipalk" target="_blank" rel="noopener noreferrer" aria-label="Chrome 확장 프로그램 (새 탭에서 열기)" data-i18n-aria="chromeExtensionOpen" title="Chrome 확장 프로그램 (새 탭에서 열기)" data-i18n-title="chromeExtensionOpen"><span class="material-symbols-outlined" aria-hidden="true">extension</span><span data-i18n="chromeExtension">Chrome 확장 프로그램</span></a>
<dialog id="linkReviewDialog" aria-labelledby="linkReviewTitle" aria-describedby="linkReviewHint">
  <div class="link-settings-head"><h2 id="linkReviewTitle" data-i18n="review">링크 확인</h2><button id="closeLinkReview" type="button" aria-label="입력으로 돌아가기" data-i18n-aria="closeReview">×</button></div>
  <p id="linkReviewHint" class="review-hint" data-i18n="reviewHint">주소와 설정을 확인한 뒤 단축해 주세요.</p>
  <dl class="link-review-summary">
    <div><dt data-i18n="urlLabel">단축할 URL</dt><dd id="reviewUrl" dir="ltr"></dd></div>
    <div><dt data-i18n="expiry">잔여 유효 기간</dt><dd id="reviewExpiry"></dd></div>
    <div><dt data-i18n="maxUses">최대 사용 횟수</dt><dd id="reviewMaxUses"></dd></div>
  </dl>
  <div class="link-review-actions"><button id="editLink" class="flow-secondary" type="button" data-i18n="edit">수정</button><button id="confirmLink" type="button" data-i18n="shorten">단축하기</button></div>
</dialog>
<dialog id="linkSettingsDialog" aria-labelledby="linkSettingsTitle">
  <div class="link-settings-head"><h2 id="linkSettingsTitle" data-i18n="settings">설정</h2><button id="closeLinkSettings" type="button" aria-label="설정 닫기" data-i18n-aria="close">×</button></div>
  <fieldset class="link-settings-field"><legend data-i18n="expiry">잔여 유효 기간</legend>
    <div class="setting-options expiry-options" role="radiogroup" aria-label="잔여 유효 기간" data-i18n-aria="expiry" data-setting="expires_in">
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="1800"><span data-i18n="expiry30m">30분</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="3600"><span data-i18n="expiry1h">1시간</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="21600"><span data-i18n="expiry6h">6시간</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="43200"><span data-i18n="expiry12h">12시간</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="86400"><span data-i18n="expiry1d">1일</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="604800"><span data-i18n="expiry7d">7일</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="2592000"><span data-i18n="expiry30d">30일</span></button>
      <button type="button" role="radio" aria-checked="true" tabindex="0" data-value="0"><span data-i18n="expiryNone">만료 기간 없음</span></button>
    </div>
  </fieldset>
  <fieldset class="link-settings-field"><legend data-i18n="maxUses">최대 사용 횟수</legend>
    <div class="setting-options use-options" role="radiogroup" aria-label="최대 사용 횟수" data-i18n-aria="maxUses" data-setting="max_uses">
      <button type="button" role="radio" aria-checked="true" tabindex="0" data-value="0"><span data-i18n="usesNone">제한 없음</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="1"><span data-i18n="uses1">1회</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="5"><span data-i18n="uses5">5회</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="10"><span data-i18n="uses10">10회</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="25"><span data-i18n="uses25">25회</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="50"><span data-i18n="uses50">50회</span></button>
      <button type="button" role="radio" aria-checked="false" tabindex="-1" data-value="100"><span data-i18n="uses100">100회</span></button>
    </div>
  </fieldset>
  <button id="applyLinkSettings" type="button"><span data-i18n="apply">적용</span></button>
  <fieldset class="language-field"><legend data-i18n="language">언어</legend>
    <div class="language-options" role="group" aria-label="언어" data-i18n-aria="language">
      <button type="button" data-language="en" aria-pressed="false"><span lang="en">English</span></button>
      <button type="button" data-language="ko" aria-pressed="true"><span lang="ko">한국어</span></button>
    </div>
  </fieldset>
</dialog>
