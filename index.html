<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="지금 할 일 하나에 집중하는 타이머, Focus.">
  <meta name="theme-color" content="#0e0c08">
  <title>Focus | 집중 타이머</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;icon_names=check,code,dark_mode,light_mode,pause,play_arrow,replay&amp;display=block">
  <link rel="stylesheet" href="style.css?v=19">
  <script src="orb.js?v=19" defer></script>
  <script src="script.js?v=19" defer></script>
</head>
<body class="dark">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="global-nav">
    <nav class="nav-inner" aria-label="주요 메뉴">
      <a class="wordmark" href="#main">Focus<span>.</span></a>
      <div class="nav-actions">
      <a class="source-link" href="https://github.com/keyqed/uiuxprogramming" aria-label="GitHub 소스 코드"><span class="material-symbols-outlined" aria-hidden="true">code</span></a>
      <button class="theme-toggle" type="button" aria-label="라이트 모드" aria-pressed="true">
        <span class="material-symbols-outlined moon" aria-hidden="true">dark_mode</span>
        <span class="material-symbols-outlined sun" aria-hidden="true">light_mode</span>
      </button>
      </div>
    </nav>
  </header>
  <main id="main">
    <div class="service-tabs" role="tablist" aria-label="Focus 메뉴">
      <button id="tab-timer" type="button" role="tab" aria-selected="true" aria-controls="panel-timer" tabindex="0">타이머</button>
      <button id="tab-records" type="button" role="tab" aria-selected="false" aria-controls="panel-records" tabindex="-1">기록</button>
      <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1">설정</button>
    </div>
    <section id="panel-timer" class="hero" role="tabpanel" aria-labelledby="tab-timer">
      <div class="clock" data-state="idle">
        <canvas class="clock-canvas" aria-hidden="true"></canvas>
        <div class="clock-center">
          <h1 id="timer-display" class="has-hours" role="timer" aria-live="off" aria-label="남은 시간 0시간 5분 15초"><span id="timer-hours">00</span><span id="hour-colon" class="clock-colon">:</span><span id="timer-minutes">05</span><span class="clock-colon">:</span><span id="timer-seconds">15</span></h1>
          <span class="visually-hidden" id="clock-state-text">READY</span>
        </div>
        <span class="material-symbols-outlined clock-complete" aria-hidden="true">check</span>
      </div>
      <div class="control-deck">
        <div class="hardware-controls">
          <button class="secondary-button hardware-button" id="timer-reset" type="button" aria-label="타이머 초기화"><span class="material-symbols-outlined" aria-hidden="true">replay</span></button>
          <div class="dial-shell">
            <div class="dial-scale" aria-hidden="true"></div>
            <div class="duration-dial" role="slider" tabindex="0" aria-label="집중 시간 다이얼" aria-valuemin="0" aria-valuemax="59" aria-valuenow="5" aria-valuetext="5분">
              <div class="dial-grip" aria-hidden="true"></div>
              <div class="dial-face" aria-hidden="true"><span class="dial-indicator"></span></div>
            </div>
            <div class="dial-value"><input id="duration-value" type="number" min="0" max="59" value="5" inputmode="numeric" aria-label="분 설정"><small id="dial-unit">분</small></div>
          </div>
          <button class="primary-button hardware-button" id="timer-toggle" type="button"><span class="material-symbols-outlined" id="toggle-icon" aria-hidden="true">play_arrow</span><span class="visually-hidden" id="toggle-label">집중 시작</span></button>
        </div>
        <div class="time-settings">
          <div class="duration-presets" role="group" aria-label="시간 단위">
            <button type="button" data-unit="seconds" aria-pressed="false">초</button>
            <button type="button" data-unit="minutes" aria-pressed="true">분</button>
            <button type="button" data-unit="hours" aria-pressed="false">시</button>
          </div>
        </div>
      </div>
      <p id="timer-status" class="timer-status" role="status" aria-live="polite"></p>
    </section>
    <section id="panel-records" class="secondary-panel" role="tabpanel" aria-labelledby="tab-records" hidden>
      <div class="panel-card records-card">
      <h2>집중 기록</h2>
      <div class="session-summary" role="group" aria-label="저장된 집중 기록">
        <div><span>완료한 세션</span><strong><span id="session-count">0</span><small>회</small></strong></div>
        <div><span>집중한 시간</span><strong><span id="focused-minutes">0</span><small id="focused-unit">분</small></strong></div>
      </div>
      <ol id="session-list" class="session-list" aria-label="완료한 집중 세션"></ol>
      </div>
    </section>
    <section id="panel-settings" class="secondary-panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="panel-card settings-card">
        <h2>설정</h2>
        <label class="setting-row" for="theme-select"><span>화면</span><select id="theme-select"><option value="dark">다크</option><option value="light">라이트</option></select></label>
        <label class="setting-row" for="sound-select"><span>완료 알림</span><select id="sound-select"><option value="off">소리 없음</option><option value="on">짧은 알림음</option></select></label>
      </div>
    </section>
    <p id="storage-status" class="storage-status" role="status" hidden></p>
  </main>
</body>
</html>
